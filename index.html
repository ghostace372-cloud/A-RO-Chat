<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AÜRÖ LUMINA PRO</title>
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=512&id=114317&format=png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/?size=512&id=114317&format=png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>

    <style>
        :root { --primary: #6366f1; --accent: #8b5cf6; }

        body { 
            margin: 0; height: 100vh; overflow: hidden;
            background: #000 url('https://w0.peakpx.com/wallpaper/32/381/HD-wallpaper-graffiti-art-creative-street-art-colorful-graffiti-urban-art.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #auth-screen, #wait-screen, #chat-screen { height: 100vh; width: 100%; display: none; flex-direction: column; }
        
        .header { 
            padding: 15px 20px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: space-between; z-index: 10;
        }
        .header h6 { color: #fff; font-weight: 800; margin: 0; }

        #msg-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; background: rgba(0, 0, 0, 0.2); }
        
        .bubble { padding: 12px 16px; border-radius: 20px; max-width: 80%; font-size: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .sent { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .received { background: rgba(255, 255, 255, 0.95); color: #1e293b; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .input-bar { 
            padding: 15px 20px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 12px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .msg-box { flex: 1; border: none; background: #fff; padding: 12px 20px; border-radius: 30px; outline: none; }

        /* Admin Panel Style */
        #admin-panel { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); 
            z-index: 9999; display: none; flex-direction: column; padding: 20px; 
        }
        .panel-card { background: white; border-radius: 30px; height: 80vh; overflow: hidden; display: flex; flex-direction: column; }

        #auth-screen { display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
        .auth-card { background: #fff; padding: 40px; border-radius: 40px; width: 90%; max-width: 380px; text-align: center; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <img src="https://img.icons8.com/?size=512&id=114317&format=png" width="80" class="mb-3">
        <h2 class="fw-bold">AÜRÖ LUMINA</h2>
        <p class="text-muted">Premium Graffiti Pro</p>
        <input type="text" id="regName" class="form-control mb-2" placeholder="အမည်">
        <input type="tel" id="regPh" class="form-control mb-3" placeholder="ဖုန်းနံပါတ်">
        <button class="btn btn-primary w-100 rounded-pill py-2 fw-bold" onclick="startAuth()">ENTER SESSION</button>
    </div>
</div>

<div id="wait-screen" class="text-center justify-content-center align-items-center" style="display:none; height:100vh; flex-direction:column; color:white;">
    <div class="spinner-border text-primary mb-3"></div>
    <h5>ခွင့်ပြုချက်စောင့်နေပါသည်...</h5>
</div>

<div id="chat-screen">
    <div class="header">
        <div class="d-flex align-items-center">
            <div id="avatar" class="rounded-circle d-flex align-items-center justify-content-center fw-bold me-2 text-white" style="width:40px; height:40px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: 2px solid white;">?</div>
            <h6>AÜRÖ CHAT</h6>
        </div>
        <i id="admin-icon" class="bi bi-shield-shaded fs-4 text-white" style="display:none; cursor:pointer;" onclick="toggleAdmin()"></i>
    </div>
    <div id="msg-display"></div>
    <div class="input-bar">
        <label style="cursor:pointer; color:white;"><i class="bi bi-plus-circle-fill fs-3"></i><input type="file" hidden accept="image/*" onchange="sendPhoto(this)"></label>
        <input type="text" id="msgInput" class="msg-box" placeholder="စာရိုက်ပါ..." onkeypress="if(event.key==='Enter') sendMsg()">
        <i class="bi bi-send-fill fs-3 text-primary" onclick="sendMsg()" style="cursor:pointer;"></i>
    </div>
</div>

<div id="admin-panel">
    <div class="panel-card shadow-lg">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light">
            <h6 class="m-0 fw-bold text-primary">ADMIN DASHBOARD</h6>
            <i class="bi bi-x-circle-fill fs-4 text-danger" onclick="toggleAdmin()" style="cursor:pointer;"></i>
        </div>
        <div id="admin-user-list" class="p-2 overflow-auto" style="flex:1;">
            <p class="text-center text-muted mt-3">စောင့်ဆိုင်းနေသူ မရှိပါ။</p>
        </div>
    </div>
</div>

<script>
    let myPhone = "", myName = "";
    const ADMIN_PH = "09672264454"; 

    const ably = new Ably.Realtime({ key: 'Nt4BVQ.HoIzUA:eXv4-B4_uJx-0PmEN1WDOQ4KMjreeEUe2_G6F5VObd8' }); 
    const mainChannel = ably.channels.get('auro_v3_fast'); 
    const controlChannel = ably.channels.get('auro_control_v3');

    function startAuth() {
        myName = document.getElementById('regName').value;
        myPhone = document.getElementById('regPh').value;
        if(!myName || !myPhone) return alert("ဖြည့်သွင်းပါ။");

        if(myPhone === ADMIN_PH) {
            enterChat();
        } else {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('wait-screen').style.display = 'flex';
            controlChannel.publish('request_access', { name: myName, phone: myPhone });
            
            controlChannel.subscribe('approval_status', (m) => {
                if(m.data.phone === myPhone && m.data.status === 'approved') enterChat();
            });
        }
    }

    function enterChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('wait-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('avatar').innerText = myName[0].toUpperCase();
        
        if(myPhone === ADMIN_PH) {
            document.getElementById('admin-icon').style.display = "block";
            controlChannel.subscribe('request_access', (m) => updateAdminUI(m.data));
        }
        mainChannel.subscribe('message', (m) => renderMsg(m.data));
    }

    function sendMsg() {
        const text = document.getElementById('msgInput').value;
        if(!text.trim()) return;
        mainChannel.publish('message', { user: myName, phone: myPhone, text: text, type: 'text' });
        document.getElementById('msgInput').value = '';
    }

    function sendPhoto(input) {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 300; canvas.height = img.height * (300/img.width);
                ctx.drawImage(img, 0, 0, 300, canvas.height);
                mainChannel.publish('message', { user: myName, phone: myPhone, image: canvas.toDataURL('image/jpeg', 0.4), type: 'image' });
            };
        };
        reader.readAsDataURL(file);
    }

    function renderMsg(data) {
        const display = document.getElementById('msg-display');
        const isMe = data.phone === myPhone;
        const div = document.createElement('div');
        div.className = `bubble ${isMe ? 'sent' : 'received'}`;
        div.innerHTML = data.type === 'image' ? `<b>${data.user}</b><br><img src="${data.image}" class="img-msg" style="width:100%; border-radius:10px;">` : `<b>${data.user}</b><br>${data.text}`;
        display.appendChild(div);
        display.scrollTop = display.scrollHeight;
    }

    let pendingUsers = [];
    function updateAdminUI(userData) {
        if(!pendingUsers.find(u => u.phone === userData.phone)) pendingUsers.push(userData);
        const list = document.getElementById('admin-user-list');
        list.innerHTML = pendingUsers.map(u => `
            <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                <span><b>${u.name}</b><br><small>${u.phone}</small></span>
                <button class="btn btn-sm btn-success rounded-pill px-3" onclick="approveUser('${u.phone}')">Accept</button>
            </div>
        `).join('') || '<p class="text-center text-muted mt-3">စောင့်ဆိုင်းနေသူ မရှိပါ။</p>';
    }

    function approveUser(phone) {
        controlChannel.publish('approval_status', { phone: phone, status: 'approved' });
        pendingUsers = pendingUsers.filter(u => u.phone !== phone);
        updateAdminUI({});
    }

    function toggleAdmin() {
        const p = document.getElementById('admin-panel');
        p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    }
</script>
</body>
</html>
