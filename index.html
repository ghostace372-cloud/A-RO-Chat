<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6366f1">

    <title>AÜRÖ Chat - Secure Login</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/733/733585.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/733/733585.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    
    <style>
        :root { --primary-color: #6366f1; --glass-bg: rgba(255, 255, 255, 0.9); }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0;
        }
        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(20px); border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3);
        }
        #auth-screen { width: 90%; max-width: 400px; padding: 40px; text-align: center; }
        .brand-icon {
            width: 70px; height: 70px; background: var(--primary-color); border-radius: 20px;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
            color: white; font-size: 2rem; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
        }
        #chat-screen { display: none; width: 95%; max-width: 900px; height: 85vh; flex-direction: column; overflow: hidden; }
        #msg-display { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .bubble-container { display: flex; width: 100%; margin-bottom: 5px; }
        .sent-container { justify-content: flex-end; }
        .received-container { justify-content: flex-start; }
        .bubble { padding: 10px 15px; border-radius: 18px; max-width: 75%; position: relative; animation: pop 0.3s ease; }
        .sent { background: var(--primary-color); color: white; border-bottom-right-radius: 4px; }
        .received { background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
        .btn-del {
            background: #ff4757; color: white; border: none; border-radius: 50%;
            width: 22px; height: 22px; font-size: 12px; cursor: pointer;
            position: absolute; top: -8px; right: -8px; display: flex; align-items: center; justify-content: center;
        }
        .u-info { font-size: 10px; font-weight: bold; margin-bottom: 2px; display: block; opacity: 0.8; }
        .time-tag { font-size: 9px; margin-top: 4px; opacity: 0.6; text-align: right; }
        .input-area { padding: 15px 25px; background: white; border-top: 1px solid #eee; }
        .btn-send { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 10px 20px; }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-screen" class="glass-panel">
    <div class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></div>
    <h3 class="fw-bold">AÜRÖ Chat</h3>
    <p class="text-muted mb-4">Unique Username Access</p>
    <div id="name-field">
        <input type="text" id="userName" class="form-control mb-3 p-3 rounded-3" placeholder="Username (Must be unique)">
    </div>
    <input type="tel" id="userPh" class="form-control mb-3 p-3 rounded-3" placeholder="Phone Number">
    <input type="password" id="userPs" class="form-control mb-4 p-3 rounded-3" placeholder="Password">
    <button class="btn btn-primary w-100 py-3 fw-bold rounded-3" onclick="handleAuth()">
        Enter Chat <i class="bi bi-arrow-right ms-2"></i>
    </button>
</div>

<div id="chat-screen" class="glass-panel">
    <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-white rounded-top-5">
        <div class="d-flex align-items-center">
            <div class="bg-primary text-white rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;" id="avatar">?</div>
            <div>
                <h6 class="m-0 fw-bold" id="headName">...</h6>
                <small class="text-success">● Online</small>
            </div>
        </div>
        <div id="adminControls" style="display:none;">
            <button class="btn btn-sm btn-outline-primary me-1" onclick="showUserList()"><i class="bi bi-people-fill"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()"><i class="bi bi-trash3-fill"></i></button>
        </div>
    </div>
    <div id="msg-display"></div>
    <div class="input-area">
        <div class="d-flex gap-2">
            <label class="btn btn-light"><i class="bi bi-image"></i><input type="file" id="imgInput" hidden onchange="sendPhoto()"></label>
            <input type="text" id="msgInput" class="form-control border-0 bg-light" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn-send" onclick="sendMsg()"><i class="bi bi-send-fill"></i></button>
        </div>
    </div>
</div>

<script>
    let myPhone = "", myName = "";
    const ADMIN_PH = "09672264454"; 
    const ably = new Ably.Realtime('Nt4BVQ.HoIzUA:eXv4-B4_uJx-0PmEN1WDOQ4KMjreeEUe2_G6F5VObd8'); 
    const channel = ably.channels.get('main-chat-room');
    const userRegistryChannel = ably.channels.get('user-registry');

    let activeUsers = {}; // နာမည်စစ်ဆေးရန်

    // User စာရင်းကို အမြဲ Update ဖြစ်နေအောင် လုပ်ခြင်း
    userRegistryChannel.subscribe('update', (msg) => {
        activeUsers = msg.data;
    });

    window.onload = function() {
        const savedUser = localStorage.getItem('last_user_info');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            document.getElementById('name-field').style.display = 'none';
            document.getElementById('userPh').value = user.phone;
            myName = user.name;
        }
    }

    function handleAuth() {
        const ph = document.getElementById('userPh').value.trim();
        const ps = document.getElementById('userPs').value.trim();
        let name = (document.getElementById('name-field').style.display !== 'none') ? 
                   document.getElementById('userName').value.trim() : myName;

        if (!ph || !ps || !name) return alert("All fields are required!");

        // Username တစ်ယောက်တစ်ခု ဟုတ်မဟုတ် စစ်ဆေးခြင်း
        for (let p in activeUsers) {
            if (activeUsers[p] === name && p !== ph) {
                return alert("ဒီ Username ကို တခြားသူတစ်ယောက်က သုံးထားပြီးပါပြီ။ နာမည်အသစ်ပေးပါ။");
            }
        }

        myPhone = ph; myName = name;
        activeUsers[myPhone] = myName;
        userRegistryChannel.publish('update', activeUsers);
        
        localStorage.setItem('last_user_info', JSON.stringify({ name: name, phone: ph }));
        showChat();
    }

    function showChat() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'flex';
        document.getElementById('headName').innerText = myName;
        document.getElementById('avatar').innerText = myName.charAt(0).toUpperCase();

        if (myPhone === ADMIN_PH) document.getElementById('adminControls').style.display = 'block';

        const history = JSON.parse(localStorage.getItem('chat_history') || "[]");
        history.forEach(data => renderMsg(data));

        channel.subscribe('msg', (msg) => {
            if (msg.data.action === 'delete') {
                document.getElementById(`msg-${msg.data.msgId}`)?.remove();
                removeFromLocal(msg.data.msgId);
            } else {
                renderMsg(msg.data);
                saveLocal(msg.data);
            }
        });
    }

    function sendMsg() {
        const input = document.getElementById('msgInput');
        if (!input.value.trim()) return;
        channel.publish('msg', {
            id: Date.now().toString(), user: myName, phone: myPhone, text: input.value, type: 'text',
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        });
        input.value = '';
    }

    function sendPhoto() {
        const file = document.getElementById('imgInput').files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            channel.publish('msg', {
                id: Date.now().toString(), user: myName, phone: myPhone, image: e.target.result, type: 'image',
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            });
        };
        reader.readAsDataURL(file);
    }

    function renderMsg(data) {
        const display = document.getElementById('msg-display');
        const isMe = data.phone === myPhone;
        const div = document.createElement('div');
        div.className = `bubble-container ${isMe ? 'sent-container' : 'received-container'}`;
        div.id = `msg-${data.id}`;
        div.innerHTML = `
            <div class="bubble ${isMe ? 'sent' : 'received'}">
                <span class="u-info">${isMe ? 'You' : data.user}</span>
                ${data.type === 'image' ? `<img src="${data.image}" style="max-width:100%; border-radius:10px;">` : `<span>${data.text}</span>`}
                <div class="time-tag">${data.time}</div>
                ${myPhone === ADMIN_PH ? `<button class="btn-del" onclick="deleteMsg('${data.id}')"><i class="bi bi-trash"></i></button>` : ''}
            </div>
        `;
        display.appendChild(div);
        display.scrollTop = display.scrollHeight;
    }

    function deleteMsg(id) {
        if(confirm("Delete this message?")) channel.publish('msg', { action: 'delete', msgId: id });
    }

    function showUserList() {
        let list = "--- Active User List ---\n";
        for (let p in activeUsers) { list += `• ${activeUsers[p]} (${p})\n`; }
        alert(list);
    }

    function saveLocal(data) {
        let history = JSON.parse(localStorage.getItem('chat_history') || "[]");
        if (!history.find(m => m.id === data.id)) { history.push(data); localStorage.setItem('chat_history', JSON.stringify(history)); }
    }

    function removeFromLocal(id) {
        let history = JSON.parse(localStorage.getItem('chat_history') || "[]");
        localStorage.setItem('chat_history', JSON.stringify(history.filter(m => m.id !== id)));
    }

    function clearHistory() { if(confirm("Clear screen?")) { localStorage.removeItem('chat_history'); location.reload(); } }
</script>
</body>
</html>
